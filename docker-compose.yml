services:
  # SAP Simulator Service - Mimics SAP API for testing
  sap-simulator:
    build:
      context: .
      target: simulator
    ports:
      - "8081:8081"
    environment:
      - SAP_SIMULATOR_PORT=8081
      - SAP_SIMULATOR_PLANNER_INPUT=${SAP_SIMULATOR_PLANNER_INPUT:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # SAP Adaptor Service - Main application
  sap-adaptor:
    build:
      context: .
      target: adaptor
    ports:
      - "8080:8080"
    environment:
      - SAP_ADAPTOR_SERVER_PORT=8080
      - SAP_ADAPTOR_SERVER_HOST=0.0.0.0
      
      - SAP_ADAPTOR_SAP_BASE_URL=${SAP_BASE_URL:-http://sap-simulator:8081}
      - SAP_ADAPTOR_SAP_USERNAME=${SAP_USERNAME}
      - SAP_ADAPTOR_SAP_PASSWORD=${SAP_PASSWORD}
      - SAP_ADAPTOR_SAP_CLIENT_ID=${SAP_CLIENT_ID}
      - SAP_ADAPTOR_SAP_CLIENT_SECRET=${SAP_CLIENT_SECRET}
      - SAP_ADAPTOR_SAP_TOKEN_URL=${SAP_TOKEN_URL}
      - SAP_ADAPTOR_SAP_TIMEOUT=30
      # Use host.docker.internal to reach services on host machine from container
      - SAP_ADAPTOR_DIGITAL_TWIN_BASE_URL=${DIGITAL_TWIN_BASE_URL:-http://host.docker.internal:8082}
      - SAP_ADAPTOR_DIGITAL_TWIN_API_KEY=${DIGITAL_TWIN_API_KEY}
      - SAP_ADAPTOR_DIGITAL_TWIN_TIMEOUT=30
      - SAP_ADAPTOR_LOG_LEVEL=info
    volumes:
      - logs:/app/logs  # Use named volume instead of bind mount
    depends_on:
      sap-simulator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  logs:
    driver: local

