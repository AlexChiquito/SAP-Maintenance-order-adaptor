openapi: 3.0.0
info:
  title: Maintenance Order
  version: 2.0.0
  description: "\r\nThis service enables you to create, read, updated and delete maintenance \r\norder data. It contains order header, operation, component, object list\r\nitem, operation relationship, long text and settlement rule nodes. The\r\nservice is based on the OData V2 protocol, and can be consumed in\r\nexternal systems, Fiori applications and on other user interfaces.\r\nIf there are any issues when retrieving the maintenance order data, the\r\nsystem displays appropriate warning or error messages in the response."
externalDocs:
  description: Business Documentation
  url: https://help.sap.com/http.svc/ahp2/SAP_S4HANA_CLOUD_PE/2023.003/EN/c1/457e0e539740a29932fbdcf36fea3c/frameset.htm
x-sap-api-type: ODATA
x-sap-shortText: Create, read, update and delete maintenance order data synchronously using this inbound service
x-sap-software-min-version: '2023'
x-sap-ext-overview:
- name: Authentication Methods
  values:
  - text: x509
    format: plain
x-sap-extensible:
  supported: manual
  description: "API can be extended by custom fields on the following business contexts (field usage for this API needs to be selected):\r\n* Asset Management: Maintenance Order Operation (EAMS_AFVC)\r\n* Asset Management: Maintenance Order (EAMS_ORD)\r\n\r\n[How to add an extension field to an API](https://help.sap.com/docs/ABAP_PLATFORM_NEW/b5670aaaa2364a29935f40b16499972d/ce819b8557194ae0aa180ba4ac6a04de.html)\r\n\r\nNote: Please make sure to match the release selected in SAP Business Accelerator Hub with the Feature Pack (FPS) on help page."
