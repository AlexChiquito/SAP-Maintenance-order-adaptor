openapi: 3.0.0
info:
  title: Digital Twin Notification Ingress API
  version: 1.0.0
  description: Inbound endpoint owned by Digital Twin to receive maintenance completion notifications from the SAP Adaptor.
tags:
  - name: Notifications
paths:
  /api/v1/maintenance-completed:
    post:
      tags: [Notifications]
      summary: Receive maintenance completion notification (TECO/CLSD)
      description: Endpoint invoked by the SAP Adaptor when an order reaches completion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceCompletedNotification'
            examples:
              example:
                value:
                  maintenanceOrder: "400000586"
                  status: "TECO"
                  description: "Mock maintenance order"
                  equipment: "10000045"
                  plant: "1000"
                  maintenanceNotification: "200000586"
                  completedAt: "2025-10-20T10:39:46Z"
                  actualStartTime: "2025-10-20T08:00:00Z"
                  actualEndTime: "2025-10-20T16:00:00Z"
                  operations:
                    - maintenanceOrderOperation: "0010"
                      text: "Mock operation"
                      status: "CNF"
                      actualWorkQuantity: 4
                      workQuantityUnit: "H"
                  components:
                    - material: "PUMP-SEAL-X200"
                      description: "High-performance pump seal"
                      requirementQuantity: 1.0
                      materialUnit: "EA"
                      goodsMovementType: "261"
                      plant: "1000"
                      storageLocation: "0001"
                    - material: "BEARING-KIT-450"
                      description: "Bearing kit for pump"
                      requirementQuantity: 1.0
                      materialUnit: "EA"
                      goodsMovementType: "261"
                      plant: "1000"
                      storageLocation: "0001"
                  objectList:
                    - equipment: "PUMP-MAIN-12345-NEW"
                      material: "PUMP-MODEL-X200"
                      serialNumber: "SN-2026-85539"
                      functionalLocation: "PLANT-AREA-01"
      responses:
        '202':
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                example:
                  value:
                    success: true
                    message: "Notification accepted"
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error

components:
  schemas:
    MaintenanceCompletedNotification:
      type: object
      required: [maintenanceOrder, status, completedAt]
      properties:
        maintenanceOrder:
          type: string
          description: SAP Maintenance Order Number
        status:
          type: string
          description: Expected TECO or CLSD
        description:
          type: string
        equipment:
          type: string
          description: SAP Equipment Number
        plant:
          type: string
        maintenanceNotification:
          type: string
          description: SAP Maintenance Notification Number
        completedAt:
          type: string
          format: date-time
        actualStartTime:
          type: string
          format: date-time
        actualEndTime:
          type: string
          format: date-time
        operations:
          type: array
          items:
            $ref: '#/components/schemas/OperationStatus'
        components:
          type: array
          description: Parts/materials consumed during maintenance
          items:
            $ref: '#/components/schemas/ComponentStatus'
        objectList:
          type: array
          description: Equipment installed/replaced during maintenance
          items:
            $ref: '#/components/schemas/ObjectListItemStatus'

    OperationStatus:
      type: object
      properties:
        maintenanceOrderOperation:
          type: string
          description: SAP Maintenance Order Operation Number
        text:
          type: string
        status:
          type: string
        actualWorkQuantity:
          type: number
          format: float
        workQuantityUnit:
          type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    ComponentStatus:
      type: object
      description: Parts/materials consumed during maintenance
      properties:
        material:
          type: string
          description: Material number/ID
        description:
          type: string
          description: Material description
        requirementQuantity:
          type: number
          format: float
          description: Quantity consumed
        materialUnit:
          type: string
          description: Unit of measure (EA, KG, etc.)
        goodsMovementType:
          type: string
          description: SAP movement type (e.g., 261 for consumption)
        plant:
          type: string
          description: Plant code
        storageLocation:
          type: string
          description: Storage location code

    ObjectListItemStatus:
      type: object
      description: Equipment installed/replaced during maintenance
      properties:
        equipment:
          type: string
          description: Equipment ID/number
        material:
          type: string
          description: Material number of the equipment
        serialNumber:
          type: string
          description: Serial number of the equipment
        functionalLocation:
          type: string
          description: Functional location code

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: string


