name: Test

# When this workflow runs
on:
  pull_request:
    branches: ["**"]  # Any PR to any branch
  push:
    branches: [main]  # Pushes to main branch
  workflow_dispatch:  # Allow manual trigger from GitHub UI

# Define what the workflow does
jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest  # Use Ubuntu Linux runner
    
    steps:
      # Step 1: Download your code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Install Go 1.24
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      
      # Step 3: Download dependencies
      - name: Download dependencies
        run: go mod download
      
      # Step 4: Verify dependencies are tidy
      # Note: swaggo/swag is a direct dependency because docs/docs.go imports it
      - name: Verify go.mod and go.sum
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      
      # Step 5: Check code formatting
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi
      
      # Step 6: Run go vet (static analysis)
      - name: Run go vet
        run: go vet ./...
      
      # Step 7: Build all binaries
      - name: Build adaptor
        run: go build -v -o bin/sap-adaptor ./cmd/server
      
      - name: Build simulator
        run: go build -v -o bin/simulator ./cmd/simulator
      
      - name: Build test client
        run: go build -v -o bin/test ./cmd/test
      
      # Step 8: Run tests with coverage
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      
      # Step 9: Upload coverage report
      - name: Upload coverage to GitHub
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false  # Don't fail if codecov upload fails
